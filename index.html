<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f3d6e" />
    <meta name="description" content="Sistem Informasi Pelaporan Giat Lapangan Satpol PP" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SIPLAP" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <title>SIPLAP — Pelaporan Giat Satpol PP</title>
    <!-- Keyframes inline agar splash pra-load langsung beranimasi tanpa menunggu CSS bundle. -->
    <style>
      @keyframes splash-ring {
        0% { opacity: .55; transform: scale(.85); }
        70% { opacity: 0; transform: scale(1.5); }
        100% { opacity: 0; transform: scale(1.5); }
      }
      @keyframes splash-bar {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      @keyframes splash-fade-out {
        to { opacity: 0; visibility: hidden; }
      }
      #splash-preload.splash-hiding {
        animation: splash-fade-out .4s ease forwards;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Splash pra-load: tampil instan sebelum JS bundle selesai, hilang otomatis. -->
    <div id="splash-preload" style="position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a">
      <div style="display:flex;align-items:center;justify-content:center;height:112px;width:112px;position:relative">
        <span id="splash-ring" style="position:absolute;inset:0;border-radius:2rem;border:2px solid rgba(245,185,66,.6);animation:splash-ring 2s ease-out infinite"></span>
        <span style="position:absolute;inset:0;border-radius:2rem;border:2px solid rgba(245,185,66,.4);animation:splash-ring 2s ease-out infinite .6s"></span>
        <div style="height:80px;width:80px;border-radius:1.6rem;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1f4d85,#0b2f56);box-shadow:0 25px 50px -12px rgba(0,0,0,.8)"><img src="/icons/favicon.svg" alt="" width="60" height="70" style="display:block"/></div>
      </div>
      <div style="margin-top:28px;font-size:24px;font-weight:700;letter-spacing:.28em;color:#fff">SIPLAP</div>
      <div style="margin-top:8px;font-size:12px;color:#94a3b8;text-align:center;line-height:1.6">Sistem Informasi Pelaporan<br/>Giat Lapangan Satpol PP</div>
      <div style="margin-top:36px;height:4px;width:176px;border-radius:9999px;overflow:hidden;background:rgba(15,61,110,.7)">
        <div style="height:100%;width:25%;border-radius:9999px;background:linear-gradient(90deg,#e5a625,#f5b942);animation:splash-bar 1.2s ease-in-out infinite"></div>
      </div>
      <script>
        // Fade-out begitu React mengisi #root, atau maksimal 2,5 detik.
        (function () {
          var el = document.getElementById('splash-preload');
          if (!el) return;
          var hidden = false;
          function hide() {
            if (hidden) return;
            hidden = true;
            el.classList.add('splash-hiding');
            setTimeout(function () { el.remove(); }, 450);
            setTimeout(function () { el.remove(); }, 2600);
          }
          new MutationObserver(function () {
            if (document.getElementById('root').childElementCount > 0) hide();
          }).observe(document.getElementById('root'), { childList: true });
          setTimeout(hide, 2500);
        })();
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
